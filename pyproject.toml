[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "north-star-group-runtime"
version = "0.1.0a1"
description = "North-Star-Group portable AI group runtime (public alpha candidate)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "fastapi>=0.138.1",
    "uvicorn>=0.49.0",
    "tzdata>=2026.3",
    # fastapi.testclient (used by the bundled public smoke test) needs httpx,
    # which is not a hard fastapi dependency. Declared so `pip install .`
    # yields a runnable public smoke test + local API.
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# The novel production workflow requires a third-party agent framework.
# It is intentionally NOT a default dependency so the clean-room CLI/API
# quickstart stays model-free and dependency-light.
novel = ["agent-framework-core==1.12.0"]

[project.scripts]
private-ai-company = "private_ai_company.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
